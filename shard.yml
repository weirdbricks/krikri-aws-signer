name: krikri-aws-signer
version: 0.3.0

repository: weirdbricks/krikri-aws-signer
homepage: https://github.com/weirdbricks/krikri-aws-signer

description: |
  AWS Signature Version 4 request signing in pure Crystal.
  Validated against AWS's public SigV4 test suite vectors and
  botocore, including STS session-token signing.

authors:
  - Krikri Contributors

crystal: ">= 1.10.0"

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.7.0"
  minitest:
    github: ysbaddaden/minitest.cr
    version: "~> 1.6.0"
